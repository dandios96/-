<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070807">
<title>Барбершоп — онлайн-запись</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ЦВЕТА. Поменяйте здесь, и изменится весь дизайн.
   ========================================================= */
:root{
  --bg:#070807;
  --bg2:#0c100e;
  --card:#0f1512;
  --line:rgba(201,169,97,.16);
  --line2:rgba(201,169,97,.38);
  --green:#006039;       /* фирменный зелёный */
  --green-hi:#0a8a55;
  --green-lo:#00391f;
  --gold:#c9a961;
  --gold-hi:#f0dc9e;
  --text:#f2efe6;
  --muted:#8f9a93;
  --danger:#e0675b;
  --r:18px;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(900px 420px at 50% -160px,rgba(0,110,64,.42),transparent 70%),
  radial-gradient(600px 300px at 110% 30%,rgba(201,169,97,.06),transparent 70%),var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
img{display:block}
#app{max-width:560px;margin:0 auto;padding:14px 16px 0}
.anim{animation:fadeUp .38s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ic{width:20px;height:20px;flex:none}
.gold{color:var(--gold)}
.muted{color:var(--muted)}
.sp{height:110px}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:48px;height:48px;flex:none;filter:drop-shadow(0 4px 14px rgba(0,120,70,.45))}
.shop{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:.08em;line-height:1;text-transform:uppercase;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagline{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--gold-hi);transition:.2s}
.icon-btn:active{transform:scale(.94);background:rgba(0,96,57,.35)}

/* ---------- баннер ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 18px;border:1px solid var(--line2);
  background:linear-gradient(140deg,#00552f 0%,#003a21 45%,#0b120e 100%)}
.hero:before{content:'';position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px);pointer-events:none}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;
  border:1px solid rgba(240,220,158,.22);box-shadow:0 0 0 18px rgba(240,220,158,.04),0 0 0 40px rgba(240,220,158,.025)}
.hero h1{position:relative;font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.05;margin:0 0 8px;color:var(--gold-hi);max-width:88%}
.hero p{position:relative;margin:0 0 14px;color:rgba(242,239,230,.82);font-size:14px;max-width:92%}
.facts{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(240,220,158,.18);color:var(--text);text-decoration:none}
.fact .ic{width:15px;height:15px;color:var(--gold)}

/* ---------- разделы ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.02em}
.sec-h.col{flex-direction:column;align-items:flex-start;gap:3px}
.sec-h small{color:var(--gold);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* мастера */
.mcard{flex:none;width:100px;scroll-snap-align:start;text-align:center;padding:12px 6px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);transition:.22s}
.mcard.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(0,96,57,.45),rgba(0,57,31,.25));box-shadow:0 8px 24px rgba(0,96,57,.35)}
.ava{display:block;width:66px;height:66px;margin:0 auto 8px;border-radius:50%;padding:2px;background:linear-gradient(160deg,rgba(201,169,97,.35),rgba(201,169,97,.08))}
.on .ava{background:linear-gradient(160deg,var(--gold-hi),var(--gold))}
.ava img,.ava .mono{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.mono{display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#0b7d4c,#00351d);font-family:var(--serif);font-weight:700;font-size:24px;color:var(--gold-hi)}
.mname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrole{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* даты */
.dchip{flex:none;width:54px;padding:8px 0 7px;border-radius:15px;text-align:center;border:1px solid var(--line);background:var(--card);transition:.2s}
.dchip .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dchip .d{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.1}
.dchip .m{font-size:10.5px;color:var(--muted)}
.dchip.on{border-color:var(--gold);background:linear-gradient(180deg,var(--green-hi),var(--green));box-shadow:0 6px 18px rgba(0,96,57,.4)}
.dchip.on .w,.dchip.on .m{color:var(--gold-hi)}
.dchip.off{opacity:.32}

/* слоты */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slot{height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:600;font-size:14.5px;letter-spacing:.03em;transition:.15s}
.slot:active,.slot.on{background:linear-gradient(180deg,var(--green-hi),var(--green));border-color:var(--gold);color:#fff}
.skel{height:42px;border-radius:13px;background:linear-gradient(90deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.08) 40%,rgba(255,255,255,.03) 80%);background-size:300% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:18px 10px;border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

/* услуги */
.svc{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:9px;transition:.18s}
.svc:active{transform:scale(.985);border-color:var(--line2)}
.svc .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(0,96,57,.28);color:var(--gold)}
.svc .t{flex:1;min-width:0}
.svc .n{font-weight:700;font-size:15px}
.svc .ds{font-size:12.5px;color:var(--muted);margin-top:1px}
.svc .p{text-align:right;flex:none}
.svc .pr{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--gold-hi);white-space:nowrap}
.svc .du{font-size:12px;color:var(--muted);white-space:nowrap}
.svc.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(0,96,57,.4),rgba(0,57,31,.2))}

.foot{margin:26px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.demo{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--gold);font-size:11px;letter-spacing:.1em}

/* ---------- главная кнопка «Запись» ---------- */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;height:60px;border-radius:20px;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;
  background:linear-gradient(135deg,#0b8a55 0%,#006039 48%,#00401f 100%);border:1px solid rgba(240,220,158,.6);
  color:var(--gold-hi);font-weight:700;font-size:16px;letter-spacing:.22em;text-transform:uppercase;
  animation:glow 2.6s ease-in-out infinite;transition:transform .15s}
.cta:active{transform:translateX(-50%) scale(.97)}
.cta:before{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,244,210,.5),transparent);animation:shine 3.4s ease-in-out infinite}
.cta:after{content:'';position:absolute;inset:3px;border-radius:17px;border:1px solid rgba(240,220,158,.18);pointer-events:none}
.cta .ic{width:22px;height:22px;animation:snip 3.4s ease-in-out infinite}
.cta.hide{display:none}
@keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(0,96,57,.5),0 0 0 0 rgba(10,138,85,.55)}50%{box-shadow:0 10px 30px rgba(0,96,57,.5),0 0 0 12px rgba(10,138,85,0)}}
@keyframes shine{0%{left:-70%}55%,100%{left:130%}}
@keyframes snip{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-16deg)}82%{transform:rotate(10deg)}88%{transform:rotate(-6deg)}}

/* ---------- страницы с шагами ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.bar h2{margin:0;font-family:var(--serif);font-size:25px;font-weight:700;flex:1}
.steps{display:flex;gap:6px;margin:-4px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{font-size:12.5px;padding:6px 11px;border-radius:999px;background:rgba(0,96,57,.25);border:1px solid var(--line);color:var(--gold-hi)}
.mrow{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:9px}
.mrow .ava{width:58px;height:58px;margin:0}
.mrow .t{flex:1;min-width:0}
.mrow .n{font-weight:700;font-size:16px}
.mrow .r{font-size:12.5px;color:var(--gold)}
.mrow .a{font-size:12.5px;color:var(--muted);margin-top:2px}
.mrow .ic{color:var(--muted)}
.any .ava{display:grid;place-items:center;background:linear-gradient(160deg,var(--gold-hi),var(--gold));color:var(--green-lo)}
.any .ava .ic{width:28px;height:28px;color:var(--green-lo)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.inp{width:100%;height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);outline:none;font-size:16px;transition:.2s}
textarea.inp{height:auto;min-height:74px;padding:12px 14px;resize:vertical;line-height:1.4}
select.inp{appearance:none}
.inp:focus{border-color:var(--gold);background:rgba(0,96,57,.12)}
.note{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}
.card{border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(0,96,57,.22),rgba(12,16,14,.9));padding:6px 16px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.kv.total b{font-family:var(--serif);font-size:24px;color:var(--gold-hi)}
.btn{width:100%;height:56px;border-radius:18px;font-weight:700;font-size:15.5px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#0b8a55,#006039 55%,#00401f);border:1px solid rgba(240,220,158,.55);color:var(--gold-hi);box-shadow:0 10px 26px rgba(0,96,57,.4);transition:.15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2);color:var(--text)}
.btn.small{height:42px;border-radius:13px;font-size:13.5px;width:auto;padding:0 16px}
.btn.danger{background:transparent;border-color:rgba(224,103,91,.5);color:var(--danger);box-shadow:none}
.mt{margin-top:16px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(240,220,158,.3);border-top-color:var(--gold-hi);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* успех */
.done{text-align:center;padding:26px 0 8px}
.okring{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#0f9a60,#00401f);box-shadow:0 0 0 8px rgba(0,96,57,.18),0 0 0 18px rgba(0,96,57,.08),0 18px 40px rgba(0,96,57,.5);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.okring svg{width:48px;height:48px;color:var(--gold-hi)}
.okring path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-family:var(--serif);font-size:32px;margin:0 0 6px;color:var(--gold-hi)}
.done p{color:var(--muted);margin:0 0 20px}

/* мои записи */
.bk{border-radius:var(--r);border:1px solid var(--line);background:var(--card);padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.bk .when{width:62px;flex:none;text-align:center;border-radius:14px;padding:8px 0;background:linear-gradient(180deg,rgba(0,96,57,.5),rgba(0,57,31,.3));border:1px solid var(--line2)}
.bk .when b{display:block;font-family:var(--serif);font-size:22px;line-height:1;color:var(--gold-hi)}
.bk .when small{font-size:11px;color:var(--muted)}
.bk .t{flex:1;min-width:0;font-size:13.5px}
.bk .t .n{font-weight:700;font-size:15px}
.bk .t .s{color:var(--muted)}
.xbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(224,103,91,.35);color:var(--danger);flex:none}

/* ---------- админка ---------- */
.tabs{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:16px;position:sticky;top:6px;z-index:5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs button{flex:1;height:38px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button.on{background:linear-gradient(180deg,var(--green-hi),var(--green));color:var(--gold-hi)}
.grp{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--gold);margin:20px 0 10px}
.grp:first-child{margin-top:4px}
.ed{border-radius:20px;border:1px solid var(--line);background:var(--card);padding:14px;margin-bottom:12px}
.ed-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ph{position:relative;width:76px;height:76px;flex:none;border-radius:50%;cursor:pointer}
.ph .ava{width:76px;height:76px;margin:0}
.ph .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--green-lo);border:2px solid var(--card)}
.ph .cam .ic{width:15px;height:15px}
.ed-top .grow{flex:1;display:grid;gap:8px;min-width:0}
.ed .inp{height:44px;font-size:15px}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 7px;letter-spacing:.03em}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{height:34px;min-width:40px;padding:0 10px;border-radius:11px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.02)}
.tg.on{background:rgba(0,96,57,.55);border-color:var(--gold);color:var(--gold-hi)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ed-foot .grow{flex:1}
.sw{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.sw input{display:none}
.sw i{width:42px;height:24px;border-radius:24px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.sw i:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd6d1;transition:.2s}
.sw input:checked+i{background:var(--green-hi)}
.sw input:checked+i:after{left:21px;background:var(--gold-hi)}
.mini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.mini.del{color:var(--danger);border-color:rgba(224,103,91,.35)}
.add{width:100%;height:50px;border-radius:16px;border:1px dashed var(--line2);color:var(--gold);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;z-index:20;transition:.25s}
.savebar.idle .btn{opacity:.5;box-shadow:none}
.banner{font-size:12.5px;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:rgba(201,169,97,.07);color:var(--gold-hi);margin-bottom:14px}
.day-h{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px}
.small-link{color:var(--gold-hi);text-decoration:none}

/* ---------- всплывашки ---------- */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:60;max-width:calc(100% - 32px);
  padding:12px 16px;border-radius:14px;background:#13201a;border:1px solid var(--line2);font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#toast.show{transform:translate(-50%,0)}
#toast.err{border-color:rgba(224,103,91,.6)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s}
.modal .box{width:100%;max-width:520px;border-radius:22px;background:#0f1612;border:1px solid var(--line2);padding:20px;animation:fadeUp .25s;margin-bottom:env(safe-area-inset-bottom)}
.modal p{margin:0 0 16px;font-size:15.5px}
.modal .row{display:flex;gap:10px}
@keyframes fade{from{opacity:0}}
.splash{min-height:80vh;display:grid;place-items:center;text-align:center}
.splash .emblem{width:84px;height:84px;margin:0 auto 14px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);filter:drop-shadow(0 0 22px rgba(10,138,85,.7))}}
</style>
</head>
<body>
<div id="app"></div>
<button id="cta" class="cta hide" data-act="cta"></button>
<div id="toast"></div>

<script>
/* =========================================================================
   НАСТРОЙКА. Вставьте ссылку на веб-приложение Apps Script (…/exec).
   Пока ссылки нет, работает ДЕМО-режим: данные хранятся на устройстве.
   ========================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxFKklkVTNMjRGp8UO0esC9ReUOuMOhzg8dTFapKpzqqwNDdTBbMvK0O4TvM1KSBrdK/exec';

/* ------------------------------------------------------------------------- */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const DEMO = !API_URL;
const app = document.getElementById('app');

    return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour') % 24) * 60 + +g('minute') };
  } catch (e) {
    const d = new Date();
    return { date: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, min: d.getHours() * 60 + d.getMinutes() };

function computeSlots(o) {
  const m = o.master, s = o.settings, now = o.now;
  if (!m || !m.active || !/^\d{4}-\d{2}-\d{2}$/.test(o.date)) return [];
  if (o.date < now.date || o.date >= addDays(now.date, Number(s.daysAhead) || 14)) return [];
  if (m.days.indexOf(isoDow(o.date)) < 0) return [];
  const step = Math.max(5, Number(s.slotStep) || 30), lead = Number(s.leadMinutes) || 0, dur = Math.max(5, o.duration || step);
  const st = toMin(m.start), en = toMin(m.end);
  const busy = o.bookings.filter(b => b.masterId === m.id && b.date === o.date && b.status !== ST_CANCEL).map(b => [toMin(b.time), toMin(b.time) + (Number(b.duration) || step)]);
  const res = [];
  for (let t = st; t + dur <= en; t += step) {
    if (o.date === now.date && t < now.min + lead) continue;
    if (busy.some(x => t < x[1] && t + dur > x[0])) continue;
    res.push(fromMin(t));
  }
  return res;
}

const DEMO_API = {
  init() {
    const c = demoCfg(), pub = Object.assign({}, c.settings); delete pub.adminIds;
    return { settings: pub, masters: c.masters.filter(m => m.active), services: c.services.filter(s => s.active), isAdmin: true, userId: DEMO_USER.id };
  },
  slots(q) {
    const c = demoCfg(), s = c.settings, now = nowIn(s.timezone), bk = demoBookings();
    const svc = q.serviceId ? c.services.find(x => x.id === q.serviceId) : null;
    const dur = svc ? svc.duration : Number(s.slotStep) || 30;
    const cands = eligible(c.masters, svc && svc.id, q.masterId || 'any');
    const start = q.date || now.date, tries = q.findNext ? Number(s.daysAhead) || 14 : 1;
    for (let i = 0; i < tries; i++) {
      const d = addDays(start, i), map = {};
      cands.forEach(m => computeSlots({ master: m, date: d, duration: dur, bookings: bk, settings: s, now }).forEach(t => (map[t] = map[t] || []).push(m.id)));
      const list = Object.keys(map).sort().map(t => ({ t, m: map[t] }));
      if (list.length || !q.findNext) return { date: d, slots: list };
    }
    return { date: start, slots: [] };
  },
  book(q) {
    const c = demoCfg(), s = c.settings, now = nowIn(s.timezone), bk = demoBookings();
    if (String(q.name || '').trim().length < 2) throw new Error('Укажите имя');
    if (String(q.phone || '').replace(/\D/g, '').length < 10) throw new Error('Укажите телефон полностью');
    const svc = c.services.find(x => x.id === q.serviceId && x.active);
    if (!svc) throw new Error('Услуга не найдена');
    const m = eligible(c.masters, svc.id, q.masterId).find(m => computeSlots({ master: m, date: q.date, duration: svc.duration, bookings: bk, settings: s, now }).includes(q.time));
    if (!m) throw new Error('Это время только что заняли. Выберите другое.');
    const b = { id: 'B' + Date.now().toString(36).toUpperCase(), date: q.date, time: q.time, duration: svc.duration, masterId: m.id, masterName: m.name, serviceId: svc.id, serviceName: svc.name, price: svc.price, clientName: q.name, phone: q.phone, tgId: String(DEMO_USER.id), tgUsername: DEMO_USER.username ? '@' + DEMO_USER.username : '', status: ST_ACTIVE };

  },
  cancel(q) {

async function api(action, data = {}) {
  if (DEMO) {
    await sleep(action === 'slots' ? 220 : 350);
    return Object.assign({ ok: true }, DEMO_API[action](data));
  }
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, initData: IN_TG ? tg.initData : '' }, data)) });
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Сервер не ответил. Проверьте ссылку API_URL.'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка сервера');

}

function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), size = Math.min(320, side);
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      let q = 0.82, out = c.toDataURL('image/jpeg', q);
      while (out.length > 45000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => rej(new Error('Не удалось открыть фото'));
    img.src = url;
  });
}

function ask(text, okText, danger) {
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<div class="box"><p>${esc(text)}</p><div class="row"><button class="btn ghost" data-r="0">Нет</button><button class="btn ${danger ? 'danger' : ''}" data-r="1">${esc(okText || 'Да')}</button></div></div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b || e.target === el) { el.remove(); res(!!(b && b.dataset.r === '1')); }
    });
    document.body.appendChild(el);
  });
}

/* ---------------- НАВИГАЦИЯ ---------------- */
async function goBack() {
  if (S.view === 'book' && S.w.hist.length) { S.w.step = S.w.hist.pop(); S.prevView = null; render(); return; }
  if (S.view === 'admin' && S.admin && S.admin.dirty && !(await ask('Есть несохранённые изменения. Выйти без сохранения?', 'Выйти', true))) return;
  S.view = 'home'; render();
}

/* ---------------- ОБРАБОТКА НАЖАТИЙ ---------------- */
const ACT = {
  cta: () => { haptic('medium'); startBooking({}); },
  home: () => { S.view = 'home'; render(); },
  back: () => goBack(),
  my: () => openMy(),
  admin: () => openAdmin(),
  homeMaster: el => { haptic('sel'); S.homeMaster = el.dataset.id; S.homeDate = null; render(); },
  homeDate: el => { haptic('sel'); S.homeDate = el.dataset.d; document.querySelectorAll('#hdates .dchip').forEach(c => c.classList.toggle('on', c === el)); const sm = document.querySelector('.sec-h small'); const m = masterById(S.homeMaster); if (sm && m) sm.textContent = m.name + ' · ' + dayLabel(S.homeDate); loadHomeSlots(); },
  homeSlot: el => { haptic('light'); startBooking({ masterId: S.homeMaster, date: S.homeDate, time: el.dataset.t }); },
  svc: el => {
    haptic('sel');
    if (S.view === 'home') return startBooking({ serviceId: el.dataset.id, step: 'master' });
    chooseService(el.dataset.id);
  },
  wMaster: el => { haptic('sel'); S.w.masterId = el.dataset.id; S.w.time = null; go('time'); },
  wDate: el => { haptic('sel'); S.w.date = el.dataset.d; S.w.time = null; document.querySelectorAll('#wdates .dchip').forEach(c => c.classList.toggle('on', c === el)); loadWizSlots(); },
  wTime: el => { haptic('light'); S.w.time = el.dataset.t; go('contacts'); },
  wContacts: () => {
    const w = S.w;
    if (w.name.trim().length < 2) return toast('Укажите имя', true);
    if (w.phone.replace(/\D/g, '').length < 10) return toast('Укажите телефон полностью', true);
    store.set('bb_name', w.name.trim()); store.set('bb_phone', w.phone.trim());
    go('confirm');
  },
  wSubmit: () => submitBooking(),
  myCancel: async el => {
    if (!(await ask('Отменить эту запись?', 'Отменить', true))) return;
    try { await api('cancel', { id: el.dataset.id }); toast('Запись отменена'); openMy(); } catch (e) { toast(e.message, true); }
  },
  tab: el => { S.admin.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  mDay: el => { const m = S.admin.data.masters[+el.dataset.i], n = +el.dataset.n; m.days = m.days.includes(n) ? m.days.filter(x => x !== n) : m.days.concat(n).sort(); el.classList.toggle('on'); markDirty(); },
  mSvc: el => { const m = S.admin.data.masters[+el.dataset.i], id = el.dataset.id; m.services = m.services.includes(id) ? m.services.filter(x => x !== id) : m.services.concat(id); markDirty(); render(); },
  mPhotoDel: el => { S.admin.data.masters[+el.dataset.i].photo = ''; markDirty(); render(); },
  move: el => { const l = S.admin.data[el.dataset.l], i = +el.dataset.i, j = i + +el.dataset.dir; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; markDirty(); render(); },
  del: async el => {
    const l = S.admin.data[el.dataset.l], i = +el.dataset.i;
    if (!(await ask(`Удалить «${l[i].name || 'без названия'}»?`, 'Удалить', true))) return;
    l.splice(i, 1); markDirty(); render();
  },
  addMaster: () => { S.admin.data.masters.push({ id: '', name: '', role: 'Барбер', about: '', photo: '', days: [1, 2, 3, 4, 5, 6], start: '10:00', end: '20:00', services: [], active: true }); markDirty(); render(); window.scrollTo(0, document.body.scrollHeight); },
  addService: () => { S.admin.data.services.push({ id: '', name: '', duration: 60, price: 0, description: '', active: true }); markDirty(); render(); window.scrollTo(0, document.body.scrollHeight); },
  save: () => saveAdmin(),
  admCancel: async el => {
    if (!(await ask('Отменить запись клиента? Ему придёт уведомление.', 'Отменить', true))) return;
    try { await api('cancel', { id: el.dataset.id }); toast('Запись отменена'); const r = await api('admin_get'); S.admin.data.bookings = r.bookings; render(); } catch (e) { toast(e.message, true); }
  },
  retry: () => boot()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
});
function onField(e) {
  const el = e.target;
  if (el.dataset.w && S.w) { S.w[el.dataset.w] = el.value; return; }
  if (el.dataset.photo != null && e.type === 'change' && el.files && el.files[0]) {
    const i = +el.dataset.photo;
    compressImage(el.files[0]).then(url => { S.admin.data.masters[i].photo = url; markDirty(); render(); toast('Фото загружено — не забудьте сохранить'); }).catch(err => toast(err.message, true));
    return;
  }
  const sc = el.dataset.sc;
  if (!sc || !S.admin || !S.admin.data) return;
  const d = S.admin.data;
  const target = sc === 'st' ? d.settings : sc === 'm' ? d.masters[+el.dataset.i] : d.services[+el.dataset.i];
  target[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  markDirty();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* ---------------- СТАРТ ---------------- */
const VIEWS = {
  splash: () => `<div class="splash"><div>${EMBLEM}<div class="muted">Загрузка…</div></div></div>`,
  error: () => `<div class="splash"><div>${EMBLEM}<p>${esc(S.error)}</p><button class="btn small" data-act="retry">Повторить</button></div></div>`,
  home: vHome, book: vBook, done: vDone, my: vMy, admin: vAdmin
};
async function loadInit() {
  const r = await api('init');
  S.settings = r.settings; S.masters = r.masters; S.services = r.services; S.isAdmin = r.isAdmin; S.userId = r.userId;
  if (!masterById(S.homeMaster)) { S.homeMaster = S.masters[0] && S.masters[0].id; S.homeDate = null; }
  document.title = (S.settings.shopName || 'Барбершоп') + ' — онлайн-запись';
}
async function boot() {
  S.view = 'splash'; render();
  try { await loadInit(); S.view = 'home'; }
  catch (e) { S.error = e.message || 'Не удалось загрузить данные'; S.view = 'error'; }
  render();
}
if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#070807');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#070807');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.BackButton.onClick(goBack);
  } catch (e) {}
}
boot();
</script>
</body>
